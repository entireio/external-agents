[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entire-agent-codetriage"
version = "0.1.0"
description = "Entire CLI external agent that gates commits with ESI blast-radius analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "mlflow>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
entire-agent-codetriage = "entire_agent_codetriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
