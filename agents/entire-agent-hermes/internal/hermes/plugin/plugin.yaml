# entire-agent-hermes observer v1
name: entire-observer
version: 0.1.0
description: "Repository-scoped, sanitized lifecycle observer for Entire"
author: Entire
kind: standalone
hooks:
  - on_session_start
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
