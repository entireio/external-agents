[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "release-gate"
version = "0.1.0"
description = "PR release-risk gate from Entire Checkpoints + Entire Graph, scored on Databricks."
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.0", "requests>=2.28"]

[project.scripts]
# Entire discovers `entire-<name>` on PATH and exposes it as `entire release-gate`.
entire-release-gate = "release_gate.plugin:main"

[tool.setuptools]
packages = ["release_gate"]
