<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple task manager that saves tasks in your browser."
    />
    <title>Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="task-app">
      <header class="app-header">
        <p class="eyebrow">Personal planner</p>
        <div class="title-row">
          <h1>My tasks</h1>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
            Dark mode
          </button>
        </div>
        <p class="subtitle">Keep the next important thing in view.</p>
      </header>

      <form class="task-form" id="task-form">
        <label class="sr-only" for="new-task">New task</label>
        <input
          id="new-task"
          name="new-task"
          type="text"
          placeholder="What needs doing?"
          autocomplete="off"
          maxlength="200"
          required
        />
        <button type="submit">Add task</button>
      </form>

      <section aria-labelledby="task-list-heading">
        <div class="list-toolbar">
          <h2 id="task-list-heading">Your list</h2>
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
          </div>
        </div>

        <p class="task-count" id="task-count" aria-live="polite"></p>
        <ul class="task-list" id="task-list"></ul>
        <p class="empty-state" id="empty-state">No tasks here yet. Add one above to get started.</p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
